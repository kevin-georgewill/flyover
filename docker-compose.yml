services:
  postgres:
    image: postgres:16-alpine
    container_name: flyover-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flyover
    ports: ["5432:5432"]
    volumes: ["flyover_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flyover"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  flyover_pgdata:
