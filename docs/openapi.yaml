openapi: 3.0.3
info:
  title: Flyover API
  version: 1.0.0
  description: MVP API contract derived from Express routes and Zod validation. All responses use success/data or
    success/error envelopes. Monetary values are JSON numbers; manual payouts do not initiate bank transfers. Phase
    11/12 APIs cover coupons, creators, private affiliate programmes, signed integrations, tracking, CRM and advanced
    analytics.
servers:
- url: http://localhost:4000/api/v1
security:
- bearerAuth: []
tags:
- name: Health
- name: Authentication
- name: Profiles
- name: Products
- name: Campaigns
- name: Marketplace
- name: Referrals
- name: Conversions
- name: Wallet
- name: Withdrawals
- name: Administration
- name: Notifications
- name: Analytics
- name: Coupons
  description: Affiliate coupon issuance, attribution and redemption management.
- name: Creators
  description: Creator profiles, discovery, deliverables and fixed-fee payment status.
- name: Affiliate Programmes
  description: Private affiliate programmes and branded registration pages.
- name: Business Teams
  description: Business membership and enterprise role management.
- name: Integrations
  description: External conversion reporting, signed webhooks, tracking and integration credentials.
- name: Tracking
  description: First/last-click tracking SDK and attribution touch collection.
- name: CRM
  description: Business affiliate relationship management.
- name: Preferences
  description: Notification preferences.
- name: Advanced Analytics
  description: Campaign and affiliate performance reporting.
