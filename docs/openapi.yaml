      properties:
        name:
          type: string
          minLength: 3
        description: *id005
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - ARCHIVED
        requiresApproval:
          type: boolean
        landingPageTitle: *id005
        landingPageDescription: *id005
        brandColor:
          type: string
          nullable: true
        customFields:
          type: array
          items:
            type: object
            additionalProperties: true
    ProgramRegistration:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone: *id005
        password:
          type: string
          minLength: 10
        answers:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
      required:
      - fullName
      - email
      - password
      example:
        fullName: Ada Example
        email: ada@example.com
        phone: '+2348000000000'
        password: StrongPassword123!
        answers:
          website: https://example.com
    ProgramApply:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
    ProgramMembershipReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - SUSPENDED
      required:
      - decision
    BusinessMemberCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - ANALYST
      required:
      - email
      - role
      example:
        email: team@example.com
        role: MANAGER
    BusinessMemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - ANALYST
        isActive:
          type: boolean
    IntegrationCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        kind:
          type: string
          enum:
          - PAYMENT
          - ECOMMERCE
          - TRACKING
          - CONVERSION_REPORTING
        provider:
          type: string
          enum:
          - GENERIC_HMAC
          - SHOPIFY
          - WOOCOMMERCE
        campaignId: *id005
        webhookSecret:
          type: string
          minLength: 16
        allowedDomains:
          type: array
          items: *id005
        config:
          type: object
          additionalProperties: true
      required:
      - name
      - kind
      description: Non-tracking integrations require webhookSecret. The secret is encrypted at rest.
      example:
        name: Store payment webhook
        kind: PAYMENT
        provider: GENERIC_HMAC
        campaignId: cm_campaign_id
        webhookSecret: replace-with-provider-secret-min-16
        allowedDomains:
        - shop.example.com
        config:
          storeId: store-123
    IntegrationStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - REVOKED
      required:
      - status
    IntegrationApiKeyCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        scopes:
          type: array
          items:
            type: string
            enum:
            - conversions:write
        expiresAt: *id004
      required:
      - name
      example:
        name: Store conversion reporting
        scopes:
        - conversions:write
        expiresAt: '2027-12-31T23:59:59.000Z'
    ExternalConversionReport:
      type: object
      properties:
        eventId: *id005
        campaignId: *id005
        referralCode: *id005
        couponCode: *id005
        externalReference: *id005
        customerReference: *id005
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        convertedAt: *id004
      required:
      - eventId
      - externalReference
      - amount
      description: At least one of referralCode or couponCode is required. API-key reports remain pending manual
        review.
      example:
        eventId: evt_2026_1001
        campaignId: cm_campaign_id
        referralCode: referralCode123
        externalReference: ORDER-2026-1001
        amount: 45000
        currency: NGN
    TrackingEvent:
      type: object
      properties:
        eventId: *id005
        eventType:
          type: string
          enum:
          - PAGE_VIEW
          - CLICK
          - LANDING
          - PRODUCT_VIEW
          - ADD_TO_CART
          - CHECKOUT
        visitorId:
          type: string
          minLength: 8
        referralCode: *id005
        couponCode: *id005
        source: *id005
        pageUrl:
          type: string
          format: uri
        referrer: *id005
      required:
      - eventId
      - eventType
      - visitorId
      example:
        eventId: evt_browser_1001
        eventType: PAGE_VIEW
        visitorId: visitor-uuid-12345678
        referralCode: referralCode123
        pageUrl: https://shop.example.com/product
    NotificationPreferenceUpdate:
      type: object
      properties:
        inAppEnabled:
          type: boolean
        emailEnabled:
          type: boolean
        mutedTypes:
          type: array
          items:
            type: string
            enum:
            - GENERAL
            - BUSINESS_VERIFICATION
            - CAMPAIGN
            - APPLICATION
            - CONVERSION
            - COMMISSION
            - WITHDRAWAL
    CrmRecordUpdate:
      type: object
      properties:
        stage:
          type: string
          enum:
          - DISCOVERED
          - CONTACTED
          - NEGOTIATING
          - PARTNER
          - INACTIVE
        tags:
          type: array
          items: *id005
          maxItems: 30
        notes:
          type: string
          maxLength: 5000
        lastContactAt: *id004
    IntegrationCredentialsUpdate:
      type: object
      properties:
        webhookSecret:
          type: string
          minLength: 16
      required:
      - webhookSecret
  parameters:
    BusinessContext:
      name: X-Business-Id
      in: header
      required: false
      description: Select a business when the authenticated BUSINESS user owns or belongs to more than one business.
        The selected business must be accessible to the caller.
      schema:
        type: string
