components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    integrationApiKey:
      type: http
      scheme: bearer
      bearerFormat: Flyover Integration API Key
      description: Use an integration API key returned once by POST /businesses/integrations/{id}/api-keys.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required:
          - code
          - message
      required:
      - success
      - error
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data: {}
      required:
      - success
      - data
    Register:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 128
          format: password
        role:
          type: string
          enum:
          - AFFILIATE
          - BUSINESS
      required:
      - fullName
      - email
      - password
      - role
      example:
        fullName: Ada Example
        email: ada@example.com
        phone: '+2348000000000'
        password: long-password-here
        role: AFFILIATE
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
      required:
      - email
      - password
      example:
        email: ada@example.com
        password: long-password-here
    Refresh:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 20
      required:
      - refreshToken
    Logout:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    AffiliateProfileUpdate:
      type: object
      properties:
        bio:
          type: string
          maxLength: 1000
        website:
          type: string
          description: Valid URL or empty string
        socialLinks:
          type: object
          additionalProperties:
            type: string
        promotionalChannels:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        audienceSize:
          type: integer
          minimum: 0
        country:
          type: string
    BusinessProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
          maxLength: 2000
        website:
          type: string
          description: Valid URL or empty string
        country:
          type: string
        registrationNumber:
          type: string
    BusinessVerification:
      type: object
      properties:
        registrationNumber:
          type: string
          minLength: 2
        verificationNotes:
          type: string
          maxLength: 2000
      required:
      - registrationNumber
    ProductCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
        price:
          type: number
          exclusiveMinimum: 0
        currency: &id002
          type: string
          minLength: 3
          maxLength: 3
          default: NGN
        category:
          type: string
        imageUrl: &id001
          type: string
          format: uri
        destinationUrl: *id001
      required:
      - name
    CampaignCreate:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 10
        instructions:
          type: string
        category:
          type: string
        country:
          type: string
          default: Nigeria
        action:
          type: string
          enum:
          - CPS
          - CPL
          - CPR
          - CPA
        commissionType:
          type: string
          enum:
          - PERCENTAGE
          - FIXED
        commissionValue:
          type: number
          exclusiveMinimum: 0
          description: Must be <= 100 for percentage commission
        currency: *id002
        access:
          type: string
          enum:
          - OPEN
          - APPROVAL
          - INVITATION
          - PRIVATE
        attributionModel:
          type: string
          enum:
          - FIRST_CLICK
          - LAST_CLICK
        attributionDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
        validationDays:
          type: integer
          minimum: 0
          maximum: 180
          default: 14
        startsAt: &id003
          type: string
          format: date-time
        endsAt: *id003
        destinationUrl: *id001
        programId:
          type: string
          description: Required when access is PRIVATE.
        compensationModel:
          type: string
          enum:
          - PERFORMANCE
          - FIXED_FEE
          - HYBRID
          default: PERFORMANCE
        fixedFeeAmount:
          type: number
          exclusiveMinimum: 0
          description: Required for FIXED_FEE and HYBRID campaigns.
        requiredDeliverables:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
      required:
      - name
      - description
      example:
        name: Promote SmartTech
        description: Earn commission on qualifying sales.
        action: CPS
        commissionType: PERCENTAGE
        commissionValue: 10
        currency: NGN
        access: OPEN
        attributionModel: LAST_CLICK
        attributionDays: 30
        validationDays: 14
        destinationUrl: https://merchant.example/product
      description: PERFORMANCE requires commissionType and commissionValue. FIXED_FEE requires fixedFeeAmount. HYBRID
        requires both. PRIVATE requires programId.
    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 10
        instructions:
          type: string
        commissionValue:
          type: number
          exclusiveMinimum: 0
          nullable: true
        access:
          type: string
          enum:
          - OPEN
          - APPROVAL
          - INVITATION
          - PRIVATE
        destinationUrl: *id001
        compensationModel:
          type: string
          enum:
          - PERFORMANCE
          - FIXED_FEE
          - HYBRID
        commissionType:
          type: string
          enum:
          - PERCENTAGE
          - FIXED
          nullable: true
        fixedFeeAmount:
          type: number
          exclusiveMinimum: 0
          nullable: true
        requiredDeliverables:
          type: integer
          minimum: 1
          maximum: 50
        programId:
          type: string
          nullable: true
    CampaignApply:
      type: object
      properties:
        message:
          type: string
          maxLength: 1000
      example:
        message: I would like to promote this campaign.
    ApplicationReview:
      type: object
      properties:
        status:
          type: string
          enum:
          - APPROVED
          - REJECTED
      required:
      - status
    ConversionCreate:
      type: object
      properties:
        referralCode:
          type: string
          minLength: 5
        externalReference:
          type: string
          minLength: 2
        amount:
          type: number
          exclusiveMinimum: 0
        currency: *id002
        customerReference:
          type: string
        evidenceUrl: *id001
        convertedAt: *id003
        couponCode:
          type: string
          minLength: 3
        campaignId:
          type: string
          description: Required when attributing by visitorId.
        visitorId:
          type: string
          minLength: 8
          maxLength: 200
          description: Used with campaignId to resolve first/last click attribution within the campaign attribution
            window.
      required:
      - externalReference
      - amount
      example:
        couponCode: SAVE10
        externalReference: ORDER-2026-1001
        amount: 45000
        currency: NGN
        customerReference: CUSTOMER-123
      description: At least one of referralCode, couponCode, or campaignId plus visitorId is required.
    ConversionReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        rejectionReason:
          type: string
          maxLength: 1000
          description: Required when rejecting
      required:
      - decision
    BusinessReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        notes:
          type: string
          maxLength: 1000
      required:
      - decision
    CampaignReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - SUSPENDED
        reason:
          type: string
          maxLength: 1000
      required:
      - decision
    UserStatus:
      type: object
      properties:
        isActive:
          type: boolean
      required:
      - isActive
    WithdrawalCreate:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: MVP minimum NGN 5,000; requires available wallet balance
        bankName:
          type: string
          minLength: 2
        accountName:
          type: string
          minLength: 2
        accountNumber:
          type: string
          minLength: 8
          maxLength: 20
      required:
      - amount
      - bankName
      - accountName
      - accountNumber
      example:
        amount: 10000
        bankName: Example Bank
        accountName: Ada Example
        accountNumber: 0123456789
    WithdrawalReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - PROCESSING
          - PAID
          - FAILED
        adminNote:
          type: string
          maxLength: 1000
        paymentReference:
          type: string
      required:
      - decision
      example:
        decision: PAID
        paymentReference: BANK-REF-123
        adminNote: Paid manually
    CouponCreate:
      type: object
      properties:
        affiliateId: &id005
          type: string
        code:
          type: string
          minLength: 3
          maxLength: 40
          pattern: ^[a-zA-Z0-9_-]+$
        discountType:
          type: string
          enum:
          - PERCENTAGE
          - FIXED_AMOUNT
        discountValue:
          type: number
          exclusiveMinimum: 0
        maxRedemptions:
          type: integer
          minimum: 1
        startsAt: &id004
          type: string
          format: date-time
        expiresAt: *id004
      required:
      - affiliateId
      - code
      - discountType
      - discountValue
      description: Affiliate must have an approved application to the campaign. Percentage discount cannot exceed
        100%.
      example:
        affiliateId: cm_affiliate_id
        code: SAVE10
        discountType: PERCENTAGE
        discountValue: 10
        maxRedemptions: 100
        expiresAt: '2027-01-31T23:59:59.000Z'
    CouponUpdate:
      type: object
      properties:
        isActive:
          type: boolean
        maxRedemptions:
          type: integer
          minimum: 1
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    CreatorProfileUpsert:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 100
        bio:
          type: string
          maxLength: 2000
        niches:
          type: array
          items: *id005
          maxItems: 30
        country:
          type: string
          default: Nigeria
        city: *id005
        languages:
          type: array
          items: *id005
          maxItems: 20
        portfolioUrl:
          type: string
          format: uri
        mediaKitUrl:
          type: string
          format: uri
        socialProfiles:
          type: object
          additionalProperties:
            type: string
            format: uri
        audienceSize:
          type: integer
          minimum: 0
        engagementRate:
          type: number
          minimum: 0
          maximum: 100
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
      required:
      - displayName
      example:
        displayName: Ada Creates
        bio: Lifestyle and technology creator
        niches:
        - Technology
        - Lifestyle
        country: Nigeria
        city: Lagos
        languages:
        - English
        portfolioUrl: https://example.com/portfolio
        audienceSize: 25000
        engagementRate: 4.8
    CreatorDeliverableCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        assetUrl:
          type: string
          format: uri
        contentType: *id005
      required:
      - title
      - assetUrl
      example:
        title: Instagram product review
        description: 30-60 second video review
        assetUrl: https://cdn.example.com/deliverables/review.mp4
        contentType: video/mp4
    CreatorDeliverableUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 2
        description: *id005
        assetUrl:
          type: string
          format: uri
        contentType: *id005
    CreatorDeliverableReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - IN_REVIEW
          - APPROVED
          - REVISION_REQUESTED
          - REJECTED
        reviewNotes:
          type: string
          maxLength: 2000
      required:
      - decision
      example:
        decision: REVISION_REQUESTED
        reviewNotes: Please include the product demonstration in the first 10 seconds.
    CreatorPaymentReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - PROCESSING
          - PAID
          - FAILED
        paymentReference: *id005
        paymentProvider: *id005
        adminNote: *id005
      required:
      - decision
      example:
        decision: PAID
        paymentReference: BANK-TRANSFER-REF-1001
        paymentProvider: Manual bank transfer
        adminNote: Paid after deliverable approval.
    AffiliateProgramCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          type: string
          maxLength: 3000
        requiresApproval:
          type: boolean
        landingPageTitle:
          type: string
          maxLength: 160
        landingPageDescription:
          type: string
          maxLength: 2000
        brandColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        customFields:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              key: *id005
              label: *id005
              required:
                type: boolean
              type:
                type: string
                enum:
                - TEXT
                - URL
                - NUMBER
            required:
